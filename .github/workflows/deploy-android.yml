name: Deploy Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
    secrets: inherit

  build-and-upload:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - name: Read app version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Write production environment config
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            apiUrl: '${{ vars.PROD_API_URL }}',
          };
          EOF

      - name: Build web assets
        run: npm run build -- --configuration production

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > muttum-release.keystore

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=muttum-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=${{ steps.pkg.outputs.version }}

      - name: Upload to Play Store (Internal testing)
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.muttum.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Clean up keystore
        if: always()
        run: rm -f muttum-release.keystore keystore.properties
