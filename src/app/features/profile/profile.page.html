<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Profil</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="profile-body" *ngIf="user">
    <!-- Avatar + name -->
    <div class="profile-hero">
      <div class="avatar" aria-hidden="true">
        {{ user.username.charAt(0).toUpperCase() }}
      </div>
      <h2 class="profile-username">{{ user.username }}</h2>
      <p class="profile-email">{{ user.email }}</p>
    </div>

    <!-- Appearance -->
    <div class="settings-group">
      <h3 class="group-label">Apparence</h3>
      <ion-list class="settings-list" lines="none">
        <ion-item class="settings-item">
          <ion-icon name="moon-outline" slot="start" aria-hidden="true" class="item-icon"></ion-icon>
          <ion-label>Mode sombre</ion-label>
          <ion-toggle
            slot="end"
            [checked]="isDark$ | async"
            (ionChange)="onThemeToggle($event)"
            aria-label="Activer le mode sombre"
            labelPlacement="start"
          ></ion-toggle>
        </ion-item>
      </ion-list>
    </div>

    <!-- Account -->
    <div class="settings-group">
      <h3 class="group-label">Compte</h3>
      <ion-list class="settings-list" lines="none">
        <ion-item class="settings-item info-item">
          <ion-icon name="person-outline" slot="start" aria-hidden="true" class="item-icon"></ion-icon>
          <ion-label>
            <p class="item-label">Nom d'utilisateur</p>
            <p class="item-value">{{ user.username }}</p>
          </ion-label>
        </ion-item>
        <ion-item class="settings-item info-item">
          <ion-icon name="mail-outline" slot="start" aria-hidden="true" class="item-icon"></ion-icon>
          <ion-label>
            <p class="item-label">Adresse e-mail</p>
            <p class="item-value">{{ user.email }}</p>
          </ion-label>
        </ion-item>
        <ion-item class="settings-item info-item">
          <ion-icon name="calendar-outline" slot="start" aria-hidden="true" class="item-icon"></ion-icon>
          <ion-label>
            <p class="item-label">Membre depuis</p>
            <p class="item-value">{{ user.createdAt | date:'MMMM yyyy':'':'fr' }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </div>

    <!-- Actions -->
    <div class="settings-group">
      <ion-list class="settings-list" lines="none">
        <ion-item
          class="settings-item danger-item"
          button
          detail="false"
          (click)="confirmLogout()"
          role="button"
          aria-label="Se déconnecter"
        >
          <ion-icon name="log-out-outline" slot="start" aria-hidden="true" class="item-icon danger-icon"></ion-icon>
          <ion-label color="danger">Se déconnecter</ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>
</ion-content>
