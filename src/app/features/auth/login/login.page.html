<ion-content class="auth-content" [fullscreen]="true">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img class="auth-logo" src="assets/logo.svg" alt="Muttum" width="174" height="64" />
        <h1 class="auth-title">Connexion</h1>
        <p class="auth-subtitle">Votre dictionnaire personnel</p>
      </div>

      <form class="auth-form" novalidate>
        <div
          class="form-field"
          [class.field-invalid]="(submitted() || emailTouched()) && emailErrors()"
        >
          <ion-item class="form-item" lines="none">
            <ion-label position="floating">Adresse e-mail</ion-label>
            <ion-input
              type="email"
              autocomplete="email"
              inputmode="email"
              aria-label="Adresse e-mail"
              aria-required="true"
              [attr.aria-describedby]="emailErrorMessage() ? 'login-email-error' : null"
              (ionInput)="email.set($event.detail.value ?? '')"
              (ionBlur)="emailTouched.set(true)"
            ></ion-input>
          </ion-item>
          @if (emailErrorMessage(); as message) {
            <p id="login-email-error" class="field-error-text" role="alert">{{ message }}</p>
          }
        </div>

        <div
          class="form-field"
          [class.field-invalid]="(submitted() || passwordTouched()) && passwordErrors()"
        >
          <ion-item class="form-item" lines="none">
            <ion-label position="floating">Mot de passe</ion-label>
            <ion-input
              [type]="isPasswordVisible() ? 'text' : 'password'"
              autocomplete="current-password"
              aria-label="Mot de passe"
              aria-required="true"
              [attr.aria-describedby]="passwordErrorMessage() ? 'login-password-error' : null"
              (ionInput)="password.set($event.detail.value ?? '')"
              (ionBlur)="passwordTouched.set(true)"
            ></ion-input>
            <ion-button
              slot="end"
              fill="clear"
              size="small"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="isPasswordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
              class="password-toggle"
            >
              <ion-icon [name]="isPasswordVisible() ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true"></ion-icon>
            </ion-button>
          </ion-item>
          @if (passwordErrorMessage(); as message) {
            <p id="login-password-error" class="field-error-text" role="alert">{{ message }}</p>
          }
        </div>

        <ion-button
          expand="block"
          type="button"
          class="submit-btn"
          [disabled]="isSubmitting()"
          (click)="submit()"
          aria-label="Se connecter"
        >
          Se connecter
        </ion-button>

        <ion-button fill="clear" size="small" routerLink="/auth/forgot-password" class="forgot-password-link">
          Mot de passe oublié ?
        </ion-button>
      </form>

      <div class="auth-footer">
        <p class="auth-link-text">Pas encore de compte ?</p>
        <ion-button fill="clear" routerLink="/auth/register" class="auth-link-btn">
          Créer un compte
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
