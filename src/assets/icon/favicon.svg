<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Muttum">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Top shimmer -->
  <rect width="64" height="32" rx="14" fill="url(#shimmer)"/>

  <!-- Amber accent -->
  <circle cx="32" cy="9" r="2.5" fill="#d97706" opacity="0.9"/>

  <!-- μ (mu) letterform -->
  <text
    x="32" y="47"
    font-family="Georgia, 'Palatino Linotype', Palatino, 'Times New Roman', serif"
    font-size="42"
    font-weight="normal"
    fill="white"
    text-anchor="middle"
  >μ</text>
</svg>
