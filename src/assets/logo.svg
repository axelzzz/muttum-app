<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140" role="img" aria-label="Muttum">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="380" height="140" rx="20" fill="url(#bg)"/>
  <!-- Subtle top shimmer -->
  <rect width="380" height="70" rx="20" fill="url(#shimmer)"/>

  <!-- Amber accent dot — marks the palindrome axis -->
  <circle cx="190" cy="20" r="3" fill="#d97706" opacity="0.9"/>

  <!-- Greek wordmark: μυττυμ -->
  <text
    x="190" y="86"
    font-family="Georgia, 'Palatino Linotype', Palatino, 'Times New Roman', serif"
    font-size="58"
    font-weight="normal"
    fill="white"
    text-anchor="middle"
    letter-spacing="5"
  >μυττυμ</text>

  <!-- Thin divider -->
  <line x1="80" y1="100" x2="300" y2="100" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Latin subtitle in caps -->
  <text
    x="190" y="122"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11"
    font-weight="500"
    fill="rgba(255,255,255,0.6)"
    text-anchor="middle"
    letter-spacing="9"
  >MUTTUM</text>
</svg>
